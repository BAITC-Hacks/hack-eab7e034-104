name: StockPilot strict audit
on:
  push:
    branches: [fix/strict-requirements-audit]
    paths: [.github/workflows/strict-audit.yml, AUDIT_RUN]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest playwright
      - name: Test deterministic logic and APIs
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/tests.xml 2>&1 | tee artifacts/tests.txt
          exit ${PIPESTATUS[0]}
      - name: Install browser
        if: hashFiles('scripts/ui_smoke.py') != ''
        run: python -m playwright install --with-deps chromium
      - name: Browser smoke test
        if: hashFiles('scripts/ui_smoke.py') != ''
        run: python scripts/ui_smoke.py
      - name: Collect audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockpilot-audit-results
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
